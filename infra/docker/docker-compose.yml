services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: custos
      POSTGRES_PASSWORD: custos
      POSTGRES_DB: custos
    ports:
      - "5433:5432"
    volumes:
      - custos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custos"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The audit seal store (ADR 0017, part 2a): a separate Postgres server
  # holding copies of the audit ledger's seals. Separate on purpose: someone
  # who can change the main database must not reach these copies. Its schema
  # and dev roles are created on first start (an empty volume) only.
  seal-store:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: custos_seal_admin
      POSTGRES_PASSWORD: custos_seal_admin
      POSTGRES_DB: custos_seals
    ports:
      - "5434:5432"
    volumes:
      - custos-seal-store:/var/lib/postgresql/data
      - ../seal-store:/custos-seal-store:ro
      - ../seal-store/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custos_seal_admin -d custos_seals"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # mTLS proxy for service-to-service calls (ADR 0009). Opt-in:
  # `pnpm dev:mtls` generates certificates and config, then starts it.
  # Image digest must match infra/mtls/images.json.
  envoy:
    profiles: ["mtls"]
    image: envoyproxy/envoy:v1.36-latest@sha256:93e25ef06d87a908a1114e8dff9a2b3a3046fbbfda7e644d448d752332633de6
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
    # Docker Desktop: uid 101 owns Envoy's keys. Linux: the generator gives
    # them to you, so set CUSTOS_ENVOY_USER=$(id -u):$(id -g).
    user: "${CUSTOS_ENVOY_USER:-101:101}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5003:5003"
      - "5004:5004"
    volumes:
      - ../mtls/certs:/etc/custos-mtls:ro
      - ../mtls/envoy.yaml:/etc/envoy/envoy.yaml:ro

  # Company-login stand-in for operator SSO (ADR 0010). Opt-in:
  # `pnpm dev:sso`. Image digest must match infra/sso/images.json. The realm
  # (infra/sso/realm-custos.json) holds throwaway local users only.
  keycloak:
    profiles: ["sso"]
    image: quay.io/keycloak/keycloak:26.8@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      # Fixed, so the issuer in every token is the URL Custos is configured with.
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8180"
    volumes:
      - ../sso/realm-custos.json:/opt/keycloak/data/import/realm-custos.json:ro

  # ---- Custos from its container images (ADR 0019). Opt-in, profile
  # `images`: `pnpm images:build`, then `pnpm images:up`. Secrets come only
  # from infra/docker/images.env (generated, gitignored), passed with
  # --env-file by those scripts; each service gets only its own. Unset, a
  # secret is empty and that service refuses to boot. `${VAR:-}` rather than
  # `${VAR:?}`: compose interpolates every profile, and plain `pnpm dev` has
  # no env file.
  #
  # One container owns the network namespace and all Custos containers join
  # it, so every service is `localhost:400x` to every other, exactly as in
  # development, and the did:web DIDs (did:web:localhost%3A4001, ...) stay
  # valid. Ports are published from the owner only.
  custos-net:
    profiles: ["images"]
    image: custos-tools:local
    pull_policy: never
    init: true
    command: ["sleep", "infinity"]
    ports:
      - "4001:4001"
      - "4002:4002"
      - "4003:4003"
      - "4004:4004"
      - "4005:4005"

  audit:
    profiles: ["images"]
    image: custos-audit:local
    pull_policy: never
    build: { context: ../.., dockerfile: infra/docker/images/Dockerfile, target: audit }
    network_mode: "service:custos-net"
    depends_on:
      custos-net: { condition: service_started }
      postgres: { condition: service_healthy }
      seal-store: { condition: service_healthy }
    environment:
      PORT: "4004"
      DATABASE_URL: postgres://custos:custos@postgres:5432/custos
      # The seal store's insert-only role (infra/seal-store/roles.dev.sql, dev password).
      AUDIT_SEAL_STORE_URL: postgres://custos_sealer:custos_sealer@seal-store:5432/custos_seals
      AUDIT_SIGNING_SEED: ${AUDIT_SIGNING_SEED:-}
    healthcheck: &custos-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:'+process.env.PORT+(process.env.PORT==='4005'?'/':'/health')).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  revocation:
    profiles: ["images"]
    image: custos-revocation:local
    pull_policy: never
    build: { context: ../.., dockerfile: infra/docker/images/Dockerfile, target: revocation }
    network_mode: "service:custos-net"
    depends_on:
      audit: { condition: service_healthy }
    environment:
      PORT: "4003"
      DATABASE_URL: postgres://custos:custos@postgres:5432/custos
      REVOCATION_SIGNING_SEED: ${REVOCATION_SIGNING_SEED:-}
      REVOCATION_SERVICE_KEY: ${REVOCATION_SERVICE_KEY:-}
    healthcheck: *custos-health

  identity:
    profiles: ["images"]
    image: custos-identity:local
    pull_policy: never
    build: { context: ../.., dockerfile: infra/docker/images/Dockerfile, target: identity }
    network_mode: "service:custos-net"
    depends_on:
      revocation: { condition: service_healthy }
    environment:
      PORT: "4001"
      DATABASE_URL: postgres://custos:custos@postgres:5432/custos
      IDENTITY_ISSUER_SEED: ${IDENTITY_ISSUER_SEED:-}
      IDENTITY_SERVICE_KEY: ${IDENTITY_SERVICE_KEY:-}
    healthcheck: *custos-health

  vault:
    profiles: ["images"]
    image: custos-vault:local
    pull_policy: never
    build: { context: ../.., dockerfile: infra/docker/images/Dockerfile, target: vault }
    network_mode: "service:custos-net"
    depends_on:
      identity: { condition: service_healthy }
    environment:
      PORT: "4002"
      DATABASE_URL: postgres://custos:custos@postgres:5432/custos
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-}
      VAULT_SERVICE_KEY: ${VAULT_SERVICE_KEY:-}
    healthcheck: *custos-health

  dashboard:
    profiles: ["images"]
    image: custos-dashboard:local
    pull_policy: never
    build: { context: ../.., dockerfile: infra/docker/images/Dockerfile, target: dashboard }
    network_mode: "service:custos-net"
    depends_on:
      vault: { condition: service_healthy }
    environment:
      PORT: "4005"
    healthcheck: *custos-health

  # Migrations, custos-admin and the custos CLI, inside the stack's network.
  # Idle until used: `docker compose ... exec tools custos <command>`.
  tools:
    profiles: ["images"]
    image: custos-tools:local
    pull_policy: never
    build: { context: ../.., dockerfile: infra/docker/images/Dockerfile, target: tools }
    network_mode: "service:custos-net"
    init: true
    command: ["sleep", "infinity"]
    depends_on:
      custos-net: { condition: service_started }
    environment:
      DATABASE_URL: postgres://custos:custos@postgres:5432/custos
      CUSTOS_OPERATOR_KEY: ${CUSTOS_OPERATOR_KEY:-}
      # The seal store's read-only role, for `custos audit-log` (dev password).
      CUSTOS_AUDIT_SEAL_STORE_URL: postgres://custos_auditor:custos_auditor@seal-store:5432/custos_seals

volumes:
  custos-postgres:
  custos-seal-store:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: custos
      POSTGRES_PASSWORD: custos
      POSTGRES_DB: custos
    ports:
      - "5433:5432"
    volumes:
      - custos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  custos-postgres:

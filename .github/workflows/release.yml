name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version-or-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate SBOM
        # @cyclonedx/cyclonedx-npm shells out to `npm ls`, which doesn't
        # understand pnpm's node_modules layout and fails the build; cdxgen
        # reads the pnpm lockfile directly.
        run: pnpm dlx @cyclonedx/cdxgen -o sbom.json --type npm
      - uses: changesets/action@v1
        with:
          # No packages are published externally yet (all private, license
          # undecided) — this opens/updates a "Version Packages" PR only.
          version: pnpm changeset version
          publish: pnpm changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

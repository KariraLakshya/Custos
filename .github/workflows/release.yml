name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version-or-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate SBOM
        # @cyclonedx/cyclonedx-npm shells out to `npm ls`, which doesn't
        # understand pnpm's node_modules layout and fails the build; cdxgen
        # reads the pnpm lockfile directly.
        run: pnpm dlx @cyclonedx/cdxgen -o sbom.json --type npm
      # v2's tag now targets a Changesets-CLI-v3-only release ("This version
      # of the Changesets action is designed to work with Changesets CLI v3.
      # Changesets CLI v2 is not supported; use Changesets action v1
      # instead"). This project is on @changesets/cli v2 (see pnpm-lock.yaml).
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          # No packages are published externally yet (all private, license
          # undecided) — this opens/updates a "Version Packages" PR only.
          version: pnpm changeset version
          publish: pnpm changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.json

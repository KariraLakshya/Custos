name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-sbom:
    runs-on: ubuntu-latest
    # Builds and records the SBOM for each merge to main. Nothing is versioned
    # or published yet (every package is private; ADR 0021), so read access is
    # all it needs.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate SBOM
        # @cyclonedx/cyclonedx-npm shells out to `npm ls`, which doesn't
        # understand pnpm's node_modules layout and fails the build; cdxgen
        # reads the pnpm lockfile directly.
        run: pnpm dlx @cyclonedx/cdxgen -o sbom.json --type npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.json
